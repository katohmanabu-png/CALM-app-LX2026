var BODY={"ja":"<p style=\"color:var(--text-dim);font-size:11px;\">最終更新日: 2026年9月8日</p><p>CALM（Cinema Advanced Lighting Matcher、以下「本アプリ」）は、映画・映像撮影のための照明計算ツールです。本ポリシーは本アプリが取り扱う情報について説明します。</p><h4>1. 収集する情報</h4><p>本アプリはアカウント登録を必要とせず、氏名・住所・メールアドレス等の個人情報を収集しません。広告・行動追跡（トラッキング）・アクセス解析は一切行いません。</p><h4>2. 端末内に保存されるデータ</h4><p>設定・お気に入り・図面（Draft）・プロジェクト・言語などの利用データは、すべてお使いの端末内（ブラウザのローカルストレージ）にのみ保存されます。これらのデータが外部サーバーに送信されることはなく、開発者や第三者が閲覧することはできません。</p><h4>3. フィードバック送信（任意）</h4><p>メニューの「Feedback」から意見を送信した場合に限り、入力した内容と、動作環境の情報（アプリのバージョン・OS・端末モデル・言語）が、不具合対応の目的で開発者に送信されます。</p><p>返信をご希望の場合のみ、「返信先」の欄にメールアドレスなどをご記入いただけます。任意の項目で、空欄でも送信できます。ご記入いただいた連絡先は返信のためだけに使い、ほかの目的に使うことも、第三者に渡すこともありません。それ以外の個人情報は入力しないようお願いします。</p><h4>4. 位置情報</h4><p>SUN SCOUT で「現在地」を押したときにのみ、端末の位置情報（緯度・経度）を取得します。その日の太陽と月の位置を計算するためと、カメラに重ねて表示するときに真北を求めるために使います。位置情報は端末内でのみ使用し、外部に送信・保存されることはありません。位置情報を使わずに、緯度・経度を手で入力して使うこともできます。</p><h4>5. カメラ</h4><p>カメラは、距離の計測と、太陽・月の道すじを実景に重ねる表示のためにのみ使用します。映像は端末内で処理するだけで、保存も外部送信もしません。図面に写真を撮って取り込む場合のみ、撮影した写真が端末内に保存されます。</p><h4>6. iCloud への保存</h4><p>図面（Draft）は、お使いの Apple アカウントの iCloud Drive に保存され、同じアカウントの端末どうしで共有されます。保存先は Apple の iCloud であり、開発者のサーバーではありません。開発者がその内容を閲覧することはできません。iCloud を使いたくない場合は、端末の設定から本アプリの iCloud Drive を切ることができます。</p><h4>7. 写真・PDFの読み込み</h4><p>Draftで読み込んだ写真やPDFは端末内に保存されるだけで、外部へアップロードされません。</p><h4>8. 外部リンク</h4><p>各メーカーのDMXチャートやマニュアルのリンクを開くと外部サイトに移動します。外部サイトでの取り扱いは各社のプライバシーポリシーに従います。</p><h4>9. データの削除</h4><p>アプリを削除するか、端末のアプリデータ／サイトデータを消去することで、保存されたデータはすべて削除されます。</p><h4>10. 購入について</h4><p>追加機能の購入は Apple の App Store を通して行われます。支払いの手続きは Apple が扱い、クレジットカード番号などの支払い情報が開発者に渡ることはありません。開発者が受け取るのは、どの品目がいくつ購入されたかという売上の集計だけで、誰が買ったかは分かりません。購入した内容は、同じ Apple アカウントでサインインしている端末に「購入を復元」から戻せます。</p><h4>11. 子どもの利用</h4><p>本アプリは13歳未満の子どもを対象としていません。</p><h4>12. 本ポリシーの変更</h4><p>本ポリシーは予告なく更新されることがあります。重要な変更がある場合はアプリ内で告知します。</p><h4>13. 計算結果と数値について</h4><p>本アプリが表示する照度・F値・ビーム角などの数値は、メーカーの公表値や配光資料をもとに計算したものです。現場では電源電圧・ランプの使用時間・個体差・反射・大気の状態など多くの要因が影響するため、<b>実際の計測結果とは異なる場合があります</b>。あくまで目安としてご利用いただき、最終的な判断は現場での実測によって行ってください。</p><p>また、機種や付属品によっては公表データが存在せず、近い条件から換算した値を用いている場合があります。ビーム角が確認できていないものは「角度未確認」と表示します。</p><p>本アプリの数値を用いた判断の結果について、開発者は責任を負いかねます。</p><h4>14. お問い合わせ</h4><p>本ポリシーに関するお問い合わせ: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","en":"<p style=\"color:var(--text-dim);font-size:11px;\">Last updated: September 8, 2026</p><p>CALM (Cinema Advanced Lighting Matcher, the \"App\") is a lighting calculation tool for film and video production. This policy explains how the App handles information.</p><h4>1. Information We Collect</h4><p>The App requires no account and collects no personal information such as your name, address, or email. It contains no advertising, no behavioral tracking, and no analytics.</p><h4>2. Data Stored on Your Device</h4><p>Your settings, favorites, drafts, projects, and language are stored only on your device (browser local storage). This data is never transmitted to any server and cannot be viewed by the developer or third parties.</p><h4>3. Feedback (optional)</h4><p>Only if you submit the in-app \"Feedback\" form, the message you write together with technical details (app version, OS, device model, language) is sent to the developer to diagnose issues.</p><p>If you would like a reply, there is an optional \"Where to reply\" field for an email address. It can be left blank. Anything you put there is used only to reply to you; it is not used for anything else and is not passed to anyone. Please do not include other personal information.</p><h4>4. Location</h4><p>Your coordinates are read only when you tap “Here” in SUN SCOUT. They are used to work out the sun and moon positions for that place, and to establish true north when the paths are laid over the camera view. Your location is used on the device only; it is never transmitted or stored elsewhere. You can also type coordinates in by hand and never use location at all.</p><h4>5. Camera</h4><p>The camera is used only to measure distance and to lay the sun and moon paths over the live view. The image is processed on the device and is neither stored nor transmitted. A photo is saved on your device only when you deliberately take one to place in a floor plan.</p><h4>6. iCloud</h4><p>Floor plans (Draft) are stored in your own iCloud Drive and shared between devices signed in to the same Apple Account. They sit in Apple’s iCloud, not on a developer server, and the developer cannot see them. You can turn iCloud Drive off for this app in your device settings.</p><h4>7. Photos & PDF Import</h4><p>Photos or PDFs you import in Draft are stored on your device only and are never uploaded.</p><h4>8. External Links</h4><p>Opening a manufacturer's DMX chart or manual link takes you to an external website governed by that company's own privacy policy.</p><h4>9. Deleting Your Data</h4><p>Uninstalling the App or clearing its app/site data removes all stored data.</p><h4>10. Purchases</h4><p>Add-ons are purchased through Apple's App Store. Apple handles the payment, and no payment details such as card numbers ever reach the developer. The developer receives only sales totals showing which items were bought and how many; they do not identify who bought them. Purchases can be brought back to any device signed in to the same Apple Account with \"Restore purchases\".</p><h4>11. Children</h4><p>The App is not directed to children under 13.</p><h4>12. Changes</h4><p>This policy may be updated. Significant changes will be announced in the App.</p><h4>13. About the calculated figures</h4><p>The illuminance, f-stop and beam angle figures shown in this app are calculated from manufacturer-published photometric data. On set, mains voltage, lamp hours, unit-to-unit variation, reflection and atmospheric conditions all have an effect, so <b>the figures may differ from an actual meter reading</b>. Treat them as a guide and make final decisions by metering on set.</p><p>For some fixtures and accessories no published data exists, and figures derived from comparable conditions are used instead. Beam angles that could not be verified are shown as “angle unverified”.</p><p>The developer cannot accept liability for decisions made using these figures.</p><h4>14. Contact</h4><p>Questions about this policy: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","es":"<p style=\"color:var(--text-dim);font-size:11px;\">Última actualización: 8 de septiembre de 2026</p><p>CALM (Cinema Advanced Lighting Matcher, la «App») es una herramienta de cálculo de iluminación para producción de cine y vídeo. Esta política explica cómo la App trata la información.</p><h4>1. Información que recopilamos</h4><p>La App no requiere cuenta y no recopila datos personales como nombre, dirección o correo. No contiene publicidad, ni seguimiento de comportamiento, ni analíticas.</p><h4>2. Datos almacenados en tu dispositivo</h4><p>Tus ajustes, favoritos, planos (Draft), proyectos e idioma se guardan solo en tu dispositivo (almacenamiento local del navegador). Estos datos nunca se envían a ningún servidor ni pueden ser vistos por el desarrollador o terceros.</p><h4>3. Comentarios (opcional)</h4><p>Solo si envías el formulario «Feedback», el mensaje que escribes junto con datos técnicos (versión de la app, SO, modelo de dispositivo, idioma) se envía al desarrollador para diagnosticar problemas.</p><p>Si quieres una respuesta, hay un campo opcional «Dónde responder» para un correo electrónico. Puede dejarse en blanco. Lo que escribas ahí se usa solo para responderte; no se usa para nada más ni se cede a terceros. No incluyas otra información personal.</p><h4>4. Ubicación</h4><p>Tus coordenadas se leen únicamente cuando pulsas “Aquí” en SUN SCOUT. Se usan para calcular la posición del sol y de la luna en ese lugar, y para determinar el norte verdadero al superponer las trayectorias sobre la cámara. La ubicación se usa solo en el dispositivo; nunca se transmite ni se guarda en otro sitio. También puedes escribir las coordenadas a mano y no usar la ubicación.</p><h4>5. Cámara</h4><p>La cámara se usa solo para medir distancias y para superponer las trayectorias del sol y la luna sobre la imagen en directo. La imagen se procesa en el dispositivo y no se guarda ni se transmite. Solo se guarda una foto cuando decides tomarla para incorporarla a un plano.</p><h4>6. iCloud</h4><p>Los planos (Draft) se guardan en tu propio iCloud Drive y se comparten entre dispositivos con la misma cuenta de Apple. Están en iCloud de Apple, no en un servidor del desarrollador, y el desarrollador no puede verlos. Puedes desactivar iCloud Drive para esta app en los ajustes del dispositivo.</p><h4>7. Fotos y PDF</h4><p>Las fotos o PDF que importas en Draft se guardan solo en tu dispositivo y nunca se suben.</p><h4>8. Enlaces externos</h4><p>Abrir un enlace de carta DMX o manual del fabricante te lleva a un sitio externo regido por la política de privacidad de esa empresa.</p><h4>9. Eliminación de datos</h4><p>Desinstalar la App o borrar sus datos elimina toda la información almacenada.</p><h4>10. Compras</h4><p>Los complementos se compran a través de la App Store de Apple. Apple gestiona el pago y ningún dato de pago, como el número de tarjeta, llega al desarrollador. El desarrollador solo recibe totales de ventas que indican qué artículos se compraron y cuántos; no identifican a quién los compró. Las compras pueden recuperarse en cualquier dispositivo con la misma cuenta de Apple mediante \"Restaurar compras\".</p><h4>11. Menores</h4><p>La App no está dirigida a menores de 13 años.</p><h4>12. Cambios</h4><p>Esta política puede actualizarse. Los cambios importantes se anunciarán en la App.</p><h4>13. Sobre los valores calculados</h4><p>La iluminancia, el número f y los ángulos de haz que muestra la aplicación se calculan a partir de datos fotométricos publicados por los fabricantes. En rodaje influyen la tensión de red, las horas de lámpara, la variación entre unidades, los reflejos y las condiciones atmosféricas, por lo que <b>los valores pueden diferir de una medición real</b>. Úsalos como orientación y decide midiendo en el set.</p><p>Para algunos equipos y accesorios no existen datos publicados y se usan valores derivados de condiciones comparables. Los ángulos que no se han podido verificar se muestran como «ángulo sin verificar».</p><p>El desarrollador no asume responsabilidad por las decisiones tomadas con estos valores.</p><h4>14. Contacto</h4><p>Preguntas sobre esta política: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","zh":"<p style=\"color:var(--text-dim);font-size:11px;\">最后更新: 2026 年 9 月 8 日 — 以英文版为准。</p><p>CALM（Cinema Advanced Lighting Matcher，以下称「本应用」）是用于电影与影像拍摄的灯光计算工具。本政策说明本应用如何处理信息。</p><h4>1. 收集的信息</h4><p>本应用无需注册账号，也不收集姓名、地址、电子邮箱等个人信息。不含广告、行为追踪和统计分析工具。</p><h4>2. 保存在设备内的数据</h4><p>设置、收藏、图纸、项目、语言等使用数据全部只保存在您的设备内（浏览器的本地存储）。这些数据不会发送到任何服务器，开发者和第三方都无法查看。</p><h4>3. 发送意见回馈（可选）</h4><p>只有在您从菜单的「Feedback」发送意见时，填写的内容才会连同运行环境信息（应用版本、系统、设备型号、语言）一起发送给开发者，用于排查问题。</p><p>只有需要回复时，才需要在「回复地址」栏填写电子邮箱等。这是可选项，留空也能发送。填写的内容仅用于回复您，不作其他用途，也不会提供给任何人。请不要填写其他个人信息。</p><h4>4. 位置信息</h4><p>只有在 SUN SCOUT 中按下「当前位置」时，才会读取设备的位置信息（经纬度），用于计算该地点的太阳和月亮位置，以及在把轨迹叠加到相机画面上时确定真北。位置信息只在设备内使用，不会发送或保存到别处。您也可以手动输入经纬度，完全不使用定位。</p><h4>5. 相机</h4><p>相机仅用于测量距离，以及把太阳和月亮的轨迹叠加到实景上显示。图像只在设备内处理，不保存也不发送。只有当您为了放入图纸而主动拍照时，照片才会保存在设备内。</p><h4>6. 保存到 iCloud</h4><p>图纸（Draft）保存在您自己 Apple 账户的 iCloud Drive 中，并在登录同一账户的设备之间共享。它们位于 Apple 的 iCloud，而非开发者的服务器，开发者无法查看。您可以在设备设置中关闭本应用的 iCloud Drive。</p><h4>7. 导入照片与 PDF</h4><p>在 Draft 中导入的照片或 PDF 只保存在设备内，不会上传到外部。</p><h4>8. 外部链接</h4><p>打开各厂商的 DMX 表格或说明书链接会跳转到外部网站。外部网站的处理方式遵循各公司自己的隐私政策。</p><h4>9. 数据的删除</h4><p>卸载本应用，或清除设备上的应用数据／网站数据，即可删除全部已保存的数据。</p><h4>10. 关于购买</h4><p>附加功能通过 Apple 的 App Store 购买。付款由 Apple 处理，银行卡号等支付信息不会传给开发者。开发者只能看到哪些项目被购买、购买了多少的销售汇总，无法得知购买者是谁。已购内容可在登录同一 Apple 账户的设备上通过「恢复购买」取回。</p><h4>11. 儿童的使用</h4><p>本应用不面向 13 岁以下的儿童。</p><h4>12. 本政策的变更</h4><p>本政策可能会更新。重要变更将在应用内告知。</p><h4>13. 关于计算所得的数值</h4><p>本应用显示的照度、F-stop、Beam angle 等数值，是根据厂商公布的配光资料计算得出的。在现场，电源电压、灯泡使用时长、个体差异、反射和大气状况都会产生影响，因此 <b>数值可能与实际测光表的读数不同</b>。请仅作参考，最终判断请在现场实测。</p><p>部分灯具和配件没有公布资料，此时改用从相近条件推得的数值。无法确认的 Beam angle 会显示为「角度未确认」。</p><p>对于依据这些数值所作的判断，开发者无法承担责任。</p><h4>14. 联系方式</h4><p>关于本政策的咨询: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","zhTW":"<p style=\"color:var(--text-dim);font-size:11px;\">最後更新: 2026 年 9 月 8 日 — 以英文版為準。</p><p>CALM（Cinema Advanced Lighting Matcher，以下稱「本應用程式」）是用於電影與影像拍攝的燈光計算工具。本政策說明本應用程式如何處理資訊。</p><h4>1. 收集的資訊</h4><p>本應用程式無需註冊帳號，也不收集姓名、地址、電子郵件等個人資料。不含廣告、行為追蹤和統計分析工具。</p><h4>2. 儲存在裝置內的資料</h4><p>設定、收藏、圖面、專案、語言等使用資料全部只儲存在您的裝置內（瀏覽器的本機儲存空間）。這些資料不會傳送到任何伺服器，開發者和第三方都無法查看。</p><h4>3. 傳送意見回饋（選填）</h4><p>只有在您從選單的「Feedback」傳送意見時，填寫的內容才會連同執行環境資訊（應用程式版本、系統、裝置型號、語言）一起傳送給開發者，用於排查問題。</p><p>只有需要回覆時，才需要在「回覆地址」欄填寫電子郵件等。這是選填項目，留空也能傳送。填寫的內容僅用於回覆您，不作其他用途，也不會提供給任何人。請不要填寫其他個人資料。</p><h4>4. 位置資訊</h4><p>只有在 SUN SCOUT 中按下「目前位置」時，才會讀取裝置的位置資訊（經緯度），用於計算該地點的太陽和月亮位置，以及在把軌跡疊加到相機畫面上時確定真北。位置資訊只在裝置內使用，不會傳送或儲存到別處。您也可以手動輸入經緯度，完全不使用定位。</p><h4>5. 相機</h4><p>相機僅用於測量距離，以及把太陽和月亮的軌跡疊加到實景上顯示。影像只在裝置內處理，不儲存也不傳送。只有當您為了放入圖面而主動拍照時，照片才會儲存在裝置內。</p><h4>6. 儲存到 iCloud</h4><p>圖面（Draft）儲存在您自己 Apple 帳號的 iCloud Drive 中，並在登入同一帳號的裝置之間共用。它們位於 Apple 的 iCloud，而非開發者的伺服器，開發者無法查看。您可以在裝置設定中關閉本應用程式的 iCloud Drive。</p><h4>7. 匯入照片與 PDF</h4><p>在 Draft 中匯入的照片或 PDF 只儲存在裝置內，不會上傳到外部。</p><h4>8. 外部連結</h4><p>開啟各廠商的 DMX 表格或說明書連結會前往外部網站。外部網站的處理方式遵循各公司自己的隱私政策。</p><h4>9. 資料的刪除</h4><p>移除本應用程式，或清除裝置上的應用程式資料／網站資料，即可刪除全部已儲存的資料。</p><h4>10. 關於購買</h4><p>附加功能透過 Apple 的 App Store 購買。付款由 Apple 處理，信用卡號等支付資訊不會傳給開發者。開發者只能看到哪些項目被購買、購買了多少的銷售彙總，無法得知購買者是誰。已購內容可在登入同一 Apple 帳戶的裝置上透過「恢復購買」取回。</p><h4>11. 兒童的使用</h4><p>本應用程式不以 13 歲以下的兒童為對象。</p><h4>12. 本政策的變更</h4><p>本政策可能會更新。重要變更將在應用程式內告知。</p><h4>13. 關於計算所得的數值</h4><p>本應用程式顯示的照度、F-stop、Beam angle 等數值，是根據廠商公布的配光資料計算得出的。在現場，電源電壓、燈泡使用時數、個體差異、反射和大氣狀況都會產生影響，因此 <b>數值可能與實際測光表的讀數不同</b>。請僅作參考，最終判斷請在現場實測。</p><p>部分燈具和配件沒有公布資料，此時改用從相近條件推得的數值。無法確認的 Beam angle 會顯示為「角度未確認」。</p><p>對於依據這些數值所作的判斷，開發者無法承擔責任。</p><h4>14. 聯絡方式</h4><p>關於本政策的詢問: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","fr":"<p style=\"color:var(--text-dim);font-size:11px;\">Dernière mise à jour : 8 septembre 2026 — La version anglaise fait foi.</p><p>CALM (Cinema Advanced Lighting Matcher, « l'application ») est un outil de calcul d'éclairage pour le cinéma et la vidéo. Cette politique explique comment l'application traite les informations.</p><h4>1. Informations collectées</h4><p>L'application ne demande aucun compte et ne collecte aucune donnée personnelle : ni nom, ni adresse, ni e-mail. Elle ne contient ni publicité, ni suivi comportemental, ni outil de mesure d'audience.</p><h4>2. Données enregistrées sur votre appareil</h4><p>Vos réglages, favoris, plans, projets et la langue sont enregistrés uniquement sur votre appareil (stockage local du navigateur). Ces données ne sont jamais transmises à un serveur et ne peuvent être consultées ni par le développeur ni par un tiers.</p><h4>3. Retours (facultatif)</h4><p>Uniquement si vous envoyez le formulaire « Feedback » depuis l'application, votre message est transmis au développeur avec quelques informations techniques (version de l'application, système, modèle d'appareil, langue) afin de diagnostiquer le problème.</p><p>Si vous souhaitez une réponse, un champ facultatif « Où répondre » permet d'indiquer une adresse e-mail. Vous pouvez le laisser vide. Ce que vous y mettez sert uniquement à vous répondre ; il n'est utilisé à aucune autre fin et n'est transmis à personne. Merci de ne pas y indiquer d'autres données personnelles.</p><h4>4. Position</h4><p>Vos coordonnées ne sont lues que lorsque vous appuyez sur « Ici » dans SUN SCOUT. Elles servent à calculer la position du soleil et de la lune pour ce lieu, et à établir le nord vrai lorsque les trajectoires sont superposées à l'image de la caméra. Votre position est utilisée sur l'appareil uniquement ; elle n'est ni transmise ni enregistrée ailleurs. Vous pouvez aussi saisir les coordonnées à la main et ne jamais utiliser la localisation.</p><h4>5. Caméra</h4><p>La caméra sert uniquement à mesurer des distances et à superposer les trajectoires du soleil et de la lune à l'image en direct. L'image est traitée sur l'appareil ; elle n'est ni enregistrée ni transmise. Une photo n'est enregistrée sur votre appareil que si vous la prenez volontairement pour la placer dans un plan.</p><h4>6. iCloud</h4><p>Les plans (Draft) sont enregistrés dans votre propre iCloud Drive et partagés entre les appareils connectés au même compte Apple. Ils se trouvent dans l'iCloud d'Apple, pas sur un serveur du développeur, et celui-ci n'y a pas accès. Vous pouvez désactiver iCloud Drive pour cette application dans les réglages de votre appareil.</p><h4>7. Import de photos et de PDF</h4><p>Les photos et les PDF que vous importez dans Draft sont enregistrés uniquement sur votre appareil et ne sont jamais téléversés.</p><h4>8. Liens externes</h4><p>Ouvrir la table DMX ou la notice d'un fabricant vous conduit sur un site externe, régi par la politique de confidentialité de cette société.</p><h4>9. Suppression de vos données</h4><p>Désinstaller l'application ou effacer ses données supprime tout ce qui a été enregistré.</p><h4>10. Achats</h4><p>Les modules sont achetés via l'App Store d'Apple. Apple gère le paiement et aucune donnée de paiement, comme un numéro de carte, ne parvient au développeur. Le développeur ne reçoit que des totaux de ventes indiquant quels articles ont été achetés et en quelle quantité ; ils n'identifient pas les acheteurs. Les achats peuvent être rétablis sur tout appareil connecté au même compte Apple avec « Restaurer les achats ».</p><h4>11. Enfants</h4><p>L'application ne s'adresse pas aux enfants de moins de 13 ans.</p><h4>12. Modifications</h4><p>Cette politique peut être mise à jour. Les changements importants seront annoncés dans l'application.</p><h4>13. À propos des valeurs calculées</h4><p>Les valeurs d'éclairement, de diaphragme et d'angle de faisceau affichées sont calculées d'après les données photométriques publiées par les fabricants. Sur le plateau, la tension du secteur, les heures de lampe, les écarts d'un exemplaire à l'autre, les réflexions et les conditions atmosphériques jouent tous un rôle : <b>les valeurs peuvent donc différer d'une mesure réelle au posemètre</b>. Prenez-les comme un repère et décidez au posemètre sur le plateau.</p><p>Pour certains projecteurs et accessoires, aucune donnée n'est publiée ; des valeurs déduites de conditions comparables sont alors utilisées. Les angles de faisceau qui n'ont pas pu être vérifiés sont indiqués « angle non vérifié ».</p><p>Le développeur ne peut être tenu responsable des décisions prises à partir de ces valeurs.</p><h4>14. Contact</h4><p>Questions au sujet de cette politique : <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","de":"<p style=\"color:var(--text-dim);font-size:11px;\">Letzte Aktualisierung: 8. September 2026 — Maßgeblich ist die englische Fassung.</p><p>CALM (Cinema Advanced Lighting Matcher, „die App“) ist ein Werkzeug zur Lichtberechnung für Film und Video. Diese Erklärung beschreibt, wie die App mit Informationen umgeht.</p><h4>1. Erhobene Informationen</h4><p>Die App braucht kein Konto und erhebt keine personenbezogenen Daten wie Name, Adresse oder E-Mail. Sie enthält keine Werbung, kein Tracking und keine Analyse-Werkzeuge.</p><h4>2. Auf dem Gerät gespeicherte Daten</h4><p>Einstellungen, Favoriten, Pläne, Projekte und die Sprache werden nur auf deinem Gerät gespeichert (lokaler Speicher des Browsers). Diese Daten werden an keinen Server übertragen und sind weder für den Entwickler noch für Dritte einsehbar.</p><h4>3. Rückmeldungen (freiwillig)</h4><p>Nur wenn du das Formular „Feedback“ in der App absendest, geht deine Nachricht zusammen mit einigen technischen Angaben (App-Version, Betriebssystem, Gerätemodell, Sprache) an den Entwickler, um das Problem eingrenzen zu können.</p><p>Wenn du eine Antwort möchtest, gibt es das freiwillige Feld „Wohin die Antwort soll“ für eine E-Mail-Adresse. Du kannst es leer lassen. Was dort steht, wird ausschließlich für die Antwort an dich verwendet, für nichts anderes, und an niemanden weitergegeben. Bitte gib dort keine weiteren personenbezogenen Daten an.</p><h4>4. Standort</h4><p>Deine Koordinaten werden nur gelesen, wenn du in SUN SCOUT auf „Hier“ tippst. Sie dienen dazu, Sonnen- und Mondstand für diesen Ort zu berechnen und den geografischen Norden zu bestimmen, wenn die Bahnen über das Kamerabild gelegt werden. Der Standort wird nur auf dem Gerät verwendet und weder übertragen noch anderswo gespeichert. Du kannst die Koordinaten auch von Hand eingeben und die Ortung gar nicht nutzen.</p><h4>5. Kamera</h4><p>Die Kamera dient nur dazu, Entfernungen zu messen und die Sonnen- und Mondbahn über das Live-Bild zu legen. Das Bild wird auf dem Gerät verarbeitet und weder gespeichert noch übertragen. Ein Foto wird nur dann auf dem Gerät gespeichert, wenn du es bewusst aufnimmst, um es in einen Grundriss zu legen.</p><h4>6. iCloud</h4><p>Pläne (Draft) werden in deinem eigenen iCloud Drive gespeichert und zwischen Geräten geteilt, die mit demselben Apple-Account angemeldet sind. Sie liegen in Apples iCloud, nicht auf einem Server des Entwicklers, und der Entwickler kann sie nicht sehen. Du kannst iCloud Drive für diese App in den Geräteeinstellungen abschalten.</p><h4>7. Fotos und PDF-Import</h4><p>Fotos oder PDFs, die du in Draft einliest, werden nur auf deinem Gerät gespeichert und nie hochgeladen.</p><h4>8. Externe Links</h4><p>Wenn du ein DMX-Chart oder eine Anleitung eines Herstellers öffnest, gelangst du auf eine externe Website, für die die Datenschutzerklärung des jeweiligen Unternehmens gilt.</p><h4>9. Löschen deiner Daten</h4><p>Wenn du die App löschst oder ihre App- bzw. Website-Daten entfernst, sind alle gespeicherten Daten weg.</p><h4>10. Käufe</h4><p>Zusatzmodule werden über Apples App Store gekauft. Apple verarbeitet die Zahlung; Zahlungsdaten wie Kartennummern erreichen den Entwickler nie. Der Entwickler erhält nur Verkaufssummen, die zeigen, welche Artikel und wie viele gekauft wurden; wer sie gekauft hat, ist daraus nicht ersichtlich. Käufe lassen sich auf jedem Gerät mit demselben Apple-Account über „Käufe wiederherstellen“ zurückholen.</p><h4>11. Kinder</h4><p>Die App richtet sich nicht an Kinder unter 13 Jahren.</p><h4>12. Änderungen</h4><p>Diese Erklärung kann aktualisiert werden. Wesentliche Änderungen werden in der App bekanntgegeben.</p><h4>13. Zu den berechneten Werten</h4><p>Die angezeigten Werte für Beleuchtungsstärke, F-stop und Beam angle werden aus den von den Herstellern veröffentlichten photometrischen Daten berechnet. Am Set wirken Netzspannung, Brenndauer der Lampe, Unterschiede zwischen einzelnen Exemplaren, Reflexionen und Wetterbedingungen mit hinein, deshalb <b>können die Werte von einer tatsächlichen Messung am Belichtungsmesser abweichen</b>. Nimm sie als Anhaltspunkt und entscheide am Set mit dem Belichtungsmesser.</p><p>Für manche Leuchten und Zubehörteile gibt es keine veröffentlichten Daten; dort werden Werte verwendet, die aus vergleichbaren Bedingungen abgeleitet sind. Beam angles, die nicht bestätigt werden konnten, werden als „Winkel nicht bestätigt“ ausgewiesen.</p><p>Der Entwickler kann keine Haftung für Entscheidungen übernehmen, die anhand dieser Werte getroffen werden.</p><h4>14. Kontakt</h4><p>Fragen zu dieser Erklärung: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","pt":"<p style=\"color:var(--text-dim);font-size:11px;\">Última atualização: 8 de setembro de 2026 — A versão em inglês prevalece.</p><p>O CALM (Cinema Advanced Lighting Matcher, o \"App\") é uma ferramenta de cálculo de luz para cinema e vídeo. Esta política explica como o App trata as informações.</p><h4>1. Informações que coletamos</h4><p>O App não exige conta e não coleta dados pessoais como nome, endereço ou e-mail. Não contém publicidade, rastreamento de comportamento nem ferramentas de análise.</p><h4>2. Dados guardados no seu aparelho</h4><p>Seus ajustes, favoritos, plantas, projetos e o idioma ficam guardados apenas no seu aparelho (armazenamento local do navegador). Esses dados nunca são enviados a nenhum servidor e não podem ser vistos pelo desenvolvedor nem por terceiros.</p><h4>3. Retorno (opcional)</h4><p>Somente se você enviar o formulário \"Feedback\" dentro do App, a sua mensagem é enviada ao desenvolvedor junto com alguns dados técnicos (versão do App, sistema, modelo do aparelho, idioma) para ajudar a diagnosticar o problema.</p><p>Se quiser uma resposta, existe o campo opcional \"Para onde responder\", para um e-mail. Pode deixar em branco. O que você colocar ali é usado apenas para responder a você; não é usado para mais nada nem repassado a ninguém. Por favor, não inclua outros dados pessoais.</p><h4>4. Localização</h4><p>Suas coordenadas são lidas apenas quando você toca em \"Aqui\" no SUN SCOUT. Elas servem para calcular a posição do sol e da lua naquele local e para estabelecer o norte verdadeiro quando as trajetórias são sobrepostas à imagem da câmera. A localização é usada só no aparelho; nunca é transmitida nem guardada em outro lugar. Você também pode digitar as coordenadas à mão e nunca usar a localização.</p><h4>5. Câmera</h4><p>A câmera é usada apenas para medir distâncias e para sobrepor as trajetórias do sol e da lua à imagem ao vivo. A imagem é processada no aparelho e não é guardada nem transmitida. Uma foto só é guardada no seu aparelho quando você a tira de propósito para colocar em uma planta.</p><h4>6. iCloud</h4><p>As plantas (Draft) ficam guardadas no seu próprio iCloud Drive e são compartilhadas entre aparelhos conectados à mesma Conta Apple. Ficam no iCloud da Apple, não em um servidor do desenvolvedor, e o desenvolvedor não pode vê-las. Você pode desativar o iCloud Drive para este App nos ajustes do aparelho.</p><h4>7. Importação de fotos e PDF</h4><p>Fotos ou PDFs que você importa no Draft ficam guardados apenas no seu aparelho e nunca são enviados para fora.</p><h4>8. Links externos</h4><p>Abrir a tabela DMX ou o manual de um fabricante leva você a um site externo, regido pela política de privacidade daquela empresa.</p><h4>9. Como apagar seus dados</h4><p>Desinstalar o App ou limpar os dados do App/site remove tudo o que estava guardado.</p><h4>10. Compras</h4><p>Os complementos são comprados pela App Store da Apple. A Apple processa o pagamento e nenhum dado de pagamento, como número de cartão, chega ao desenvolvedor. O desenvolvedor recebe apenas totais de vendas indicando quais itens foram comprados e quantos; eles não identificam quem comprou. As compras podem ser recuperadas em qualquer dispositivo com a mesma conta Apple usando \"Restaurar compras\".</p><h4>11. Crianças</h4><p>O App não é destinado a crianças menores de 13 anos.</p><h4>12. Alterações</h4><p>Esta política pode ser atualizada. Mudanças relevantes serão anunciadas no App.</p><h4>13. Sobre os valores calculados</h4><p>Os valores de iluminância, F-stop e Beam angle mostrados no App são calculados a partir dos dados fotométricos publicados pelos fabricantes. No set, a tensão da rede, as horas de uso da lâmpada, a variação entre unidades, reflexões e as condições atmosféricas influenciam o resultado, por isso <b>os valores podem diferir de uma leitura real no fotômetro</b>. Use-os como referência e decida medindo no set.</p><p>Para alguns refletores e acessórios não existe dado publicado; nesses casos são usados valores obtidos de condições comparáveis. Os Beam angles que não puderam ser verificados aparecem como \"ângulo não verificado\".</p><p>O desenvolvedor não pode se responsabilizar por decisões tomadas com base nesses valores.</p><h4>14. Contato</h4><p>Dúvidas sobre esta política: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","ptPT":"<p style=\"color:var(--text-dim);font-size:11px;\">Última atualização: 8 de setembro de 2026 — A versão em inglês prevalece.</p><p>O CALM (Cinema Advanced Lighting Matcher, a \"aplicação\") é uma ferramenta de cálculo de luz para cinema e vídeo. Esta política explica como a aplicação trata as informações.</p><h4>1. Informações recolhidas</h4><p>A aplicação não exige conta e não recolhe dados pessoais como nome, endereço ou e-mail. Não contém publicidade, rastreio de comportamento nem ferramentas de análise.</p><h4>2. Dados guardados no seu dispositivo</h4><p>As suas definições, favoritos, plantas, projetos e o idioma ficam guardados apenas no seu dispositivo (armazenamento local do navegador). Estes dados nunca são enviados para nenhum servidor e não podem ser vistos pelo desenvolvedor nem por terceiros.</p><h4>3. Comentários (facultativo)</h4><p>Apenas se enviar o formulário \"Feedback\" dentro da aplicação, a sua mensagem é enviada ao desenvolvedor juntamente com alguns dados técnicos (versão da aplicação, sistema, modelo do dispositivo, idioma) para ajudar a diagnosticar o problema.</p><p>Se quiser resposta, existe o campo facultativo \"Para onde responder\", para um e-mail. Pode deixar em branco. O que colocar aí é usado apenas para lhe responder; não é usado para mais nada nem partilhado com ninguém. Por favor, não inclua outros dados pessoais.</p><h4>4. Localização</h4><p>As suas coordenadas são lidas apenas quando toca em \"Aqui\" no SUN SCOUT. Servem para calcular a posição do sol e da lua nesse local e para estabelecer o norte verdadeiro quando os percursos são sobrepostos à imagem da câmara. A localização é usada apenas no dispositivo; nunca é transmitida nem guardada noutro lugar. Também pode introduzir as coordenadas à mão e nunca usar a localização.</p><h4>5. Câmara</h4><p>A câmara é usada apenas para medir distâncias e para sobrepor os percursos do sol e da lua à imagem em direto. A imagem é processada no dispositivo e não é guardada nem transmitida. Uma foto só é guardada no seu dispositivo quando a tira de propósito para colocar numa planta.</p><h4>6. iCloud</h4><p>As plantas (Draft) ficam guardadas no seu próprio iCloud Drive e são partilhadas entre dispositivos com sessão iniciada na mesma Conta Apple. Ficam no iCloud da Apple, não num servidor do desenvolvedor, e este não as pode ver. Pode desativar o iCloud Drive para esta aplicação nas definições do dispositivo.</p><h4>7. Importação de fotos e PDF</h4><p>As fotos ou PDF que importa no Draft ficam guardados apenas no seu dispositivo e nunca são enviados para fora.</p><h4>8. Ligações externas</h4><p>Abrir a tabela DMX ou o manual de um fabricante leva-o a um sítio externo, regido pela política de privacidade dessa empresa.</p><h4>9. Eliminar os seus dados</h4><p>Desinstalar a aplicação ou limpar os dados da aplicação/sítio remove tudo o que estava guardado.</p><h4>10. Compras</h4><p>Os complementos são comprados na App Store da Apple. A Apple processa o pagamento e nenhum dado de pagamento, como o número do cartão, chega ao desenvolvedor. O desenvolvedor recebe apenas totais de vendas que indicam quais os artigos comprados e quantos; não identificam quem os comprou. As compras podem ser restauradas em qualquer dispositivo com a mesma conta Apple através de \"Restaurar compras\".</p><h4>11. Crianças</h4><p>A aplicação não se destina a crianças com menos de 13 anos.</p><h4>12. Alterações</h4><p>Esta política pode ser atualizada. As alterações relevantes serão anunciadas na aplicação.</p><h4>13. Sobre os valores calculados</h4><p>Os valores de iluminância, F-stop e Beam angle apresentados são calculados a partir dos dados fotométricos publicados pelos fabricantes. No set, a tensão da rede, as horas de uso da lâmpada, a variação entre exemplares, reflexões e as condições atmosféricas influenciam o resultado, por isso <b>os valores podem diferir de uma leitura real no fotómetro</b>. Use-os como referência e decida medindo no set.</p><p>Para alguns projetores e acessórios não existe dado publicado; nesses casos são usados valores obtidos de condições comparáveis. Os Beam angles que não foi possível verificar aparecem como \"ângulo não verificado\".</p><p>O desenvolvedor não pode responsabilizar-se por decisões tomadas com base nestes valores.</p><h4>14. Contacto</h4><p>Questões sobre esta política: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","fi":"<p style=\"color:var(--text-dim);font-size:11px;\">Viimeksi päivitetty: 8. syyskuuta 2026 — Englanninkielinen versio on määräävä.</p><p>CALM (Cinema Advanced Lighting Matcher, \"sovellus\") on valon laskennan työkalu elokuva- ja videotuotantoon. Tässä käytännössä kerrotaan, miten sovellus käsittelee tietoja.</p><h4>1. Kerättävät tiedot</h4><p>Sovellus ei vaadi tiliä eikä kerää henkilötietoja, kuten nimeä, osoitetta tai sähköpostia. Siinä ei ole mainoksia, käyttäytymisen seurantaa eikä analytiikkaa.</p><h4>2. Laitteelle tallentuvat tiedot</h4><p>Asetukset, suosikit, pohjat, projektit ja kieli tallentuvat vain omalle laitteellesi (selaimen paikallinen tallennus). Näitä tietoja ei koskaan lähetetä palvelimelle, eikä kehittäjä tai kolmas osapuoli näe niitä.</p><h4>3. Palaute (valinnainen)</h4><p>Vain jos lähetät sovelluksen \"Feedback\"-lomakkeen, viestisi menee kehittäjälle yhdessä muutaman teknisen tiedon kanssa (sovelluksen versio, käyttöjärjestelmä, laitemalli, kieli), jotta ongelma voidaan selvittää.</p><p>Jos haluat vastauksen, käytössä on valinnainen kenttä \"Mihin vastataan\" sähköpostiosoitteelle. Voit jättää sen tyhjäksi. Siihen kirjoitettua käytetään ainoastaan vastaamiseen, ei mihinkään muuhun, eikä sitä luovuteta kenellekään. Älä kirjoita siihen muita henkilötietoja.</p><h4>4. Sijainti</h4><p>Koordinaattisi luetaan vain, kun napautat SUN SCOUTissa \"Tässä\". Niillä lasketaan auringon ja kuun paikka kyseisessä paikassa ja määritetään tosi pohjoinen, kun radat piirretään kameran kuvan päälle. Sijaintia käytetään vain laitteella; sitä ei lähetetä eikä tallenneta muualle. Voit myös syöttää koordinaatit käsin ja jättää paikannuksen kokonaan käyttämättä.</p><h4>5. Kamera</h4><p>Kameraa käytetään vain etäisyyksien mittaamiseen ja auringon ja kuun ratojen piirtämiseen live-kuvan päälle. Kuva käsitellään laitteella, eikä sitä tallenneta tai lähetetä. Valokuva tallentuu laitteellesi vain, kun otat sen tarkoituksella pohjakuvaan asetettavaksi.</p><h4>6. iCloud</h4><p>Pohjat (Draft) tallentuvat omaan iCloud Driveesi ja jakautuvat samalle Apple-tilille kirjautuneiden laitteiden välillä. Ne ovat Applen iCloudissa, ei kehittäjän palvelimella, eikä kehittäjä näe niitä. Voit kytkeä iCloud Driven pois tältä sovellukselta laitteen asetuksista.</p><h4>7. Kuvien ja PDF-tiedostojen tuonti</h4><p>Draftiin tuodut valokuvat ja PDF-tiedostot tallentuvat vain laitteellesi eikä niitä koskaan lähetetä eteenpäin.</p><h4>8. Ulkoiset linkit</h4><p>Valmistajan DMX-kartan tai käyttöohjeen avaaminen vie ulkoiselle sivustolle, jota koskee kyseisen yrityksen oma tietosuojakäytäntö.</p><h4>9. Tietojen poistaminen</h4><p>Sovelluksen poistaminen tai sen sovellus- ja sivustotietojen tyhjentäminen poistaa kaikki tallennetut tiedot.</p><h4>10. Ostokset</h4><p>Lisäosat ostetaan Applen App Storesta. Apple käsittelee maksun, eikä maksutietoja, kuten korttinumeroita, päädy koskaan kehittäjälle. Kehittäjä saa vain myyntisummat, joista näkyy mitkä tuotteet on ostettu ja kuinka monta; niistä ei näy kuka on ostanut. Ostokset voi palauttaa mille tahansa laitteelle, jossa on sama Apple-tili, kohdasta \"Palauta ostokset\".</p><h4>11. Lapset</h4><p>Sovellusta ei ole tarkoitettu alle 13-vuotiaille.</p><h4>12. Muutokset</h4><p>Tätä käytäntöä voidaan päivittää. Merkittävistä muutoksista ilmoitetaan sovelluksessa.</p><h4>13. Laskettuja arvoja koskeva huomautus</h4><p>Sovelluksen näyttämät valaistusvoimakkuuden, F-stopin ja Beam anglen arvot lasketaan valmistajien julkaisemista fotometrisista tiedoista. Kuvauspaikalla verkkojännite, lampun käyttötunnit, yksilöiden väliset erot, heijastukset ja sääolot vaikuttavat kaikki tulokseen, joten <b>arvot voivat poiketa valotusmittarin todellisesta lukemasta</b>. Käytä niitä suuntaviivana ja tee lopullinen päätös mittaamalla paikan päällä.</p><p>Joistakin valaisimista ja lisävarusteista ei ole julkaistua tietoa; niissä käytetään vastaavista olosuhteista johdettuja arvoja. Beam anglet, joita ei voitu vahvistaa, näytetään muodossa \"kulmaa ei vahvistettu\".</p><p>Kehittäjä ei voi ottaa vastuuta näiden arvojen perusteella tehdyistä päätöksistä.</p><h4>14. Yhteystiedot</h4><p>Tätä käytäntöä koskevat kysymykset: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","ko":"<p style=\"color:var(--text-dim);font-size:11px;\">최종 갱신일: 2026년 9월 8일 — 영어판을 정본으로 합니다.</p><p>CALM(Cinema Advanced Lighting Matcher, 이하 「본 앱」)은 영화·영상 촬영을 위한 조명 계산 도구입니다. 본 방침은 본 앱이 정보를 어떻게 다루는지 설명합니다.</p><h4>1. 수집하는 정보</h4><p>본 앱은 계정 등록이 필요하지 않으며, 이름·주소·이메일 주소 등의 개인정보를 수집하지 않습니다. 광고, 행동 추적, 분석 도구도 넣지 않았습니다.</p><h4>2. 기기 안에 저장되는 데이터</h4><p>설정·즐겨찾기·도면·프로젝트·언어 등의 이용 데이터는 모두 사용하는 기기 안(브라우저의 로컬 저장 영역)에만 저장됩니다. 이 데이터는 서버로 전송되지 않으며, 개발자나 제3자가 볼 수 없습니다.</p><h4>3. 피드백 전송(선택)</h4><p>메뉴의 「Feedback」에서 의견을 보낸 경우에만, 입력한 내용과 동작 환경 정보(앱 버전·OS·기기 모델·언어)가 문제 파악을 위해 개발자에게 전송됩니다.</p><p>회신을 원하는 경우에만 「회신 받을 곳」 칸에 이메일 주소 등을 적을 수 있습니다. 선택 항목이며 비워 두어도 보낼 수 있습니다. 적어 주신 내용은 회신에만 사용하고 다른 용도로는 쓰지 않으며, 누구에게도 넘기지 않습니다. 그 밖의 개인정보는 적지 말아 주세요.</p><h4>4. 위치 정보</h4><p>SUN SCOUT에서 「현재 위치」를 눌렀을 때만 기기의 위치 정보(위도·경도)를 가져옵니다. 그 장소의 태양과 달의 위치를 계산하고, 경로를 카메라 화면에 겹칠 때 진북을 정하는 데 씁니다. 위치 정보는 기기 안에서만 사용하며, 전송하거나 다른 곳에 저장하지 않습니다. 위도·경도를 직접 입력해서 위치 정보를 전혀 쓰지 않을 수도 있습니다.</p><h4>5. 카메라</h4><p>카메라는 거리 측정과, 태양·달의 경로를 실제 풍경에 겹쳐 보이는 표시에만 사용합니다. 영상은 기기 안에서 처리할 뿐 저장하거나 전송하지 않습니다. 사진은 도면에 넣기 위해 직접 촬영한 경우에만 기기 안에 저장됩니다.</p><h4>6. iCloud 저장</h4><p>도면(Draft)은 사용하시는 Apple 계정의 iCloud Drive에 저장되어 같은 계정의 기기 사이에서 공유됩니다. Apple의 iCloud 안에 있으며 개발자의 서버에는 없고, 개발자는 볼 수 없습니다. 기기 설정에서 본 앱의 iCloud Drive를 끌 수 있습니다.</p><h4>7. 사진·PDF 불러오기</h4><p>Draft에서 불러온 사진이나 PDF는 기기 안에만 저장되며, 외부로 업로드되지 않습니다.</p><h4>8. 외부 링크</h4><p>각 제조사의 DMX 차트나 매뉴얼 링크를 열면 외부 사이트로 이동합니다. 외부 사이트에서의 취급은 각 회사의 개인정보 방침에 따릅니다.</p><h4>9. 데이터 삭제</h4><p>앱을 삭제하거나 기기의 앱 데이터·사이트 데이터를 지우면, 저장된 데이터는 모두 삭제됩니다.</p><h4>10. 구입에 대하여</h4><p>추가 기능은 Apple의 App Store를 통해 구입합니다. 결제는 Apple이 처리하며, 카드 번호 등의 결제 정보가 개발자에게 전달되는 일은 없습니다. 개발자가 받는 것은 어떤 항목이 몇 개 구입되었는지에 대한 매출 집계뿐이며, 누가 구입했는지는 알 수 없습니다. 구입한 내용은 같은 Apple 계정으로 로그인한 기기에서 「구입 복원」으로 되돌릴 수 있습니다.</p><h4>11. 어린이의 이용</h4><p>본 앱은 13세 미만의 어린이를 대상으로 하지 않습니다.</p><h4>12. 본 방침의 변경</h4><p>본 방침은 갱신될 수 있습니다. 중요한 변경은 앱 안에서 알립니다.</p><h4>13. 계산된 수치에 대하여</h4><p>본 앱이 표시하는 조도·F-stop·Beam angle 등의 수치는 제조사가 공표한 배광 자료를 바탕으로 계산한 것입니다. 현장에서는 전원 전압, 램프의 사용 시간, 개체 차이, 반사, 대기 상태가 모두 영향을 주므로 <b>실제 노출계의 값과 다를 수 있습니다</b>. 기준으로만 쓰시고, 최종 판단은 현장에서 측정해 주세요.</p><p>일부 조명기와 액세서리는 공표 자료가 없어, 비슷한 조건에서 얻은 값을 대신 쓰고 있습니다. 확인할 수 없었던 Beam angle은 「각도 미확인」으로 표시합니다.</p><p>이 수치를 바탕으로 내린 판단에 대해 개발자는 책임을 지지 않습니다.</p><h4>14. 문의</h4><p>본 방침에 관한 문의: <a href=\"mailto:katohmanabu@protonmail.com\">katohmanabu@protonmail.com</a></p>","th":"<p style=\"color:var(--text-dim);font-size:11px;\">ปรับปรุงล่าสุด: 8 กันยายน 2026 — ให้ถือฉบับภาษาอังกฤษเป็นฉบับหลัก</p><p>CALM (Cinema Advanced Lighting Matcher ต่อไปนี้เรียกว่า \"แอป\") เป็นเครื่องมือคำนวณแสงสำหรับงานถ่ายภาพยนตร์และวิดีโอ นโยบายนี้อธิบายว่าแอปจัดการข้อมูลอย่างไร</p><h4>1. ข้อมูลที่เก็บ</h4><p>แอปไม่ต้องสมัครบัญชี และไม่เก็บข้อมูลส่วนบุคคล เช่น ชื่อ ที่อยู่ หรืออีเมล ไม่มีโฆษณา ไม่มีการติดตามพฤติกรรม และไม่มีเครื่องมือวิเคราะห์การใช้งาน</p><h4>2. ข้อมูลที่เก็บไว้ในเครื่องของคุณ</h4><p>การตั้งค่า รายการโปรด ผังไฟ โปรเจกต์ และภาษา ถูกเก็บไว้ในเครื่องของคุณเท่านั้น (พื้นที่จัดเก็บในเบราว์เซอร์) ข้อมูลเหล่านี้ไม่ถูกส่งไปยังเซิร์ฟเวอร์ใด ๆ และผู้พัฒนาหรือบุคคลที่สามไม่สามารถดูได้</p><h4>3. การส่งข้อเสนอแนะ (ไม่บังคับ)</h4><p>เฉพาะเมื่อคุณส่งแบบฟอร์ม \"Feedback\" จากในแอป ข้อความที่คุณเขียนจะถูกส่งไปยังผู้พัฒนาพร้อมข้อมูลทางเทคนิคบางส่วน (เวอร์ชันแอป ระบบปฏิบัติการ รุ่นเครื่อง ภาษา) เพื่อใช้ตรวจหาสาเหตุของปัญหา</p><p>หากต้องการให้ตอบกลับ มีช่อง \"ช่องทางให้ตอบกลับ\" สำหรับกรอกอีเมล ซึ่งไม่บังคับและเว้นว่างได้ ข้อมูลที่กรอกจะใช้เพื่อตอบกลับคุณเท่านั้น ไม่ใช้เพื่อการอื่นและไม่ส่งต่อให้ใคร กรุณาไม่กรอกข้อมูลส่วนบุคคลอื่น ๆ</p><h4>4. ตำแหน่งที่ตั้ง</h4><p>พิกัดของคุณจะถูกอ่านเฉพาะเมื่อกด \"ตำแหน่งปัจจุบัน\" ใน SUN SCOUT เพื่อคำนวณตำแหน่งดวงอาทิตย์และดวงจันทร์ของสถานที่นั้น และเพื่อกำหนดทิศเหนือจริงเมื่อซ้อนเส้นทางลงบนภาพจากกล้อง ตำแหน่งถูกใช้ในเครื่องเท่านั้น ไม่ถูกส่งออกหรือเก็บไว้ที่อื่น คุณยังพิมพ์พิกัดเองและไม่ใช้ตำแหน่งเลยก็ได้</p><h4>5. กล้อง</h4><p>กล้องถูกใช้เพื่อวัดระยะและซ้อนเส้นทางของดวงอาทิตย์และดวงจันทร์ลงบนภาพสดเท่านั้น ภาพถูกประมวลผลในเครื่อง ไม่ถูกบันทึกหรือส่งออก รูปจะถูกบันทึกในเครื่องเฉพาะเมื่อคุณตั้งใจถ่ายเพื่อนำไปวางในผังไฟ</p><h4>6. การเก็บใน iCloud</h4><p>ผังไฟ (Draft) ถูกเก็บใน iCloud Drive ของบัญชี Apple ของคุณ และแชร์ระหว่างเครื่องที่ลงชื่อเข้าใช้บัญชีเดียวกัน ข้อมูลอยู่ใน iCloud ของ Apple ไม่ได้อยู่บนเซิร์ฟเวอร์ของผู้พัฒนา และผู้พัฒนาไม่สามารถดูได้ คุณสามารถปิด iCloud Drive ของแอปนี้ได้จากการตั้งค่าเครื่อง</p><h4>7. การนำเข้ารูปภาพและ PDF</h4><p>รูปภาพหรือ PDF ที่นำเข้าใน Draft ถูกเก็บไว้ในเครื่องเท่านั้น และไม่เคยถูกอัปโหลดออกไป</p><h4>8. ลิงก์ภายนอก</h4><p>การเปิดตาราง DMX หรือคู่มือของผู้ผลิตจะพาไปยังเว็บไซต์ภายนอก ซึ่งอยู่ภายใต้นโยบายความเป็นส่วนตัวของบริษัทนั้น</p><h4>9. การลบข้อมูล</h4><p>การถอนการติดตั้งแอป หรือการล้างข้อมูลแอป/ข้อมูลเว็บไซต์ในเครื่อง จะลบข้อมูลที่บันทึกไว้ทั้งหมด</p><h4>10. เกี่ยวกับการซื้อ</h4><p>ฟังก์ชันเสริมซื้อผ่าน App Store ของ Apple การชำระเงินดำเนินการโดย Apple และข้อมูลการชำระเงิน เช่น หมายเลขบัตร จะไม่ถูกส่งถึงผู้พัฒนา ผู้พัฒนาได้รับเพียงยอดขายรวมที่ระบุว่ามีการซื้อรายการใดและจำนวนเท่าใด ไม่สามารถทราบได้ว่าใครเป็นผู้ซื้อ รายการที่ซื้อสามารถกู้คืนได้บนเครื่องที่ลงชื่อเข้าใช้บัญชี Apple เดียวกันด้วย \"กู้คืนการซื้อ\"</p><h4>11. การใช้งานของเด็ก</h4><p>แอปนี้ไม่ได้มีเป้าหมายเป็นเด็กอายุต่ำกว่า 13 ปี</p><h4>12. การเปลี่ยนแปลงนโยบาย</h4><p>นโยบายนี้อาจมีการปรับปรุง การเปลี่ยนแปลงที่สำคัญจะแจ้งให้ทราบในแอป</p><h4>13. เกี่ยวกับค่าที่คำนวณได้</h4><p>ค่าความสว่าง F-stop และ Beam angle ที่แอปแสดง คำนวณจากข้อมูลการกระจายแสงที่ผู้ผลิตเผยแพร่ ในหน้างานจริง แรงดันไฟ function pickLang(have){
  var q=(location.search.match(/lang=([A-Za-z]+)/)||[])[1]; if(q&&have[q]) return q;
  var n=(navigator.language||"en").toLowerCase();
  if(/^zh-(tw|hk|mo)|^zh-hant/.test(n)&&have.zhTW) return "zhTW";
  if(/^pt-pt/.test(n)&&have.ptPT) return "ptPT";
  var b=n.slice(0,2); return have[b]?b:"en";
}
